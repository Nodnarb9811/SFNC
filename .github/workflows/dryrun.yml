name: TEMP dry-run report

on:
  push:
    paths:
      - ".github/workflows/dryrun.yml"
  workflow_dispatch: {}

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          TRYBOOKING_API_KEY: ${{ secrets.TRYBOOKING_API_KEY }}
          TRYBOOKING_SECRET: ${{ secrets.TRYBOOKING_SECRET }}
        run: python run_daily.py --dry-run

name: Daily TryBooking ticket-sales report

# Runs every day, plus a "Run workflow" button you can click to test it now.
on:
  schedule:
    # 22:00 UTC = 8:00am Australian Eastern Standard Time (9:00am during
    # daylight saving). GitHub only understands UTC. Adjust if you like.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send the daily report
        env:
          # --- secrets you add in GitHub (Settings -> Secrets) ---
          TRYBOOKING_API_KEY: ${{ secrets.TRYBOOKING_API_KEY }}
          TRYBOOKING_SECRET: ${{ secrets.TRYBOOKING_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # --- non-secret settings (Microsoft 365) ---
          SMTP_HOST: smtp.office365.com
          SMTP_PORT: "587"
          SMTP_SECURITY: tls
          REPORT_TO: shop@ssfnc.com.au
          REPORT_FROM: ${{ secrets.SMTP_USER }}
        run: python run_daily.py
